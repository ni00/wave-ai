name: wave-ai
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.46
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -master.telemetry=false
      - -admin.ui=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.autoCreateBucket=false
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Run make setup and configure deploy/.env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Run make setup and configure deploy/.env}
      S3_BUCKET: ${WAVE_S3_BUCKET:-wave}
    volumes:
      - seaweed_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --head --max-time 3 --aws-sigv4 aws:amz:us-east-1:s3 --user \"$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY\" http://127.0.0.1:8333/$$S3_BUCKET >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wave
      POSTGRES_PASSWORD: ${WAVE_DB_PASSWORD:?run make setup to generate WAVE_DB_PASSWORD}
      POSTGRES_DB: wave
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wave"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
  init-db:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["init-db"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WAVE_DATABASE_URL: postgres://wave:${WAVE_DB_PASSWORD:?run make setup to generate WAVE_DB_PASSWORD}@postgres:5432/wave?sslmode=disable
  wave:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      seaweedfs:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    environment:
      WAVE_ROLE: all
      WAVE_LOG_LEVEL: ${WAVE_LOG_LEVEL:-INFO}
      WAVE_HTTP_ADDR: ':8080'
      WAVE_DATABASE_URL: postgres://wave:${WAVE_DB_PASSWORD:?run make setup to generate WAVE_DB_PASSWORD}@postgres:5432/wave?sslmode=disable
      WAVE_DATA_DIR: /var/lib/wave
      WAVE_STORAGE_BACKEND: ${WAVE_STORAGE_BACKEND:-s3}
      WAVE_S3_BUCKET: ${WAVE_S3_BUCKET:-wave}
      WAVE_S3_REGION: ${WAVE_S3_REGION:-us-east-1}
      WAVE_S3_ENDPOINT: ${WAVE_S3_ENDPOINT-http://seaweedfs:8333}
      WAVE_S3_PREFIX: ${WAVE_S3_PREFIX:-wave}
      WAVE_S3_PATH_STYLE: ${WAVE_S3_PATH_STYLE:-true}
      WAVE_S3_ALLOW_HTTP: ${WAVE_S3_ALLOW_HTTP:-true}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      WAVE_MODEL_BASE_URL: ${WAVE_MODEL_BASE_URL:-https://api.openai.com/v1}
      WAVE_MODEL_API_KEY: ${WAVE_MODEL_API_KEY:-}
      WAVE_MODEL_TIMEOUT_SEC: ${WAVE_MODEL_TIMEOUT_SEC:-300}
      WAVE_CONTEXT_TOKENS: ${WAVE_CONTEXT_TOKENS:-32000}
      WAVE_WORKER_CONCURRENCY: ${WAVE_WORKER_CONCURRENCY:-10}
      WAVE_LEASE_SECONDS: ${WAVE_LEASE_SECONDS:-30}
      WAVE_DELTA_FLUSH_BYTES: ${WAVE_DELTA_FLUSH_BYTES:-4096}
      WAVE_DELTA_FLUSH_MS: ${WAVE_DELTA_FLUSH_MS:-500}
      WAVE_AUTH_CACHE_TTL_SEC: ${WAVE_AUTH_CACHE_TTL_SEC:-15}
      WAVE_DB_MAX_OPEN_CONNS: ${WAVE_DB_MAX_OPEN_CONNS:-32}
      WAVE_SANDBOX_BACKEND: ${WAVE_SANDBOX_BACKEND:-gvisor}
      WAVE_DOCKER_HOST: unix:///var/run/docker.sock
      WAVE_GVISOR_RUNTIME: ${WAVE_GVISOR_RUNTIME:-wave-runsc}
      WAVE_CONTAINER_IMAGE: ${WAVE_CONTAINER_IMAGE:-docker.io/library/python:3.12-slim-bookworm}
      WAVE_CONTAINER_NETWORK: ${WAVE_CONTAINER_NETWORK:-none}
      WAVE_SANDBOX_CPUS: ${WAVE_SANDBOX_CPUS:-1}
      WAVE_SANDBOX_MEMORY_MIB: ${WAVE_SANDBOX_MEMORY_MIB:-1024}
      WAVE_SANDBOX_MAX_RUNNING: ${WAVE_SANDBOX_MAX_RUNNING:-2}
      WAVE_SANDBOX_MEMORY_BUDGET_MIB: ${WAVE_SANDBOX_MEMORY_BUDGET_MIB:-4096}
      WAVE_SANDBOX_WORKSPACE_GIB: ${WAVE_SANDBOX_WORKSPACE_GIB:-0}
      WAVE_MASTER_KEY: ${WAVE_MASTER_KEY:?Run make setup and keep deploy/.env safe}
      WAVE_GUARDRAIL_INPUT_BLOCK: ${WAVE_GUARDRAIL_INPUT_BLOCK:-}
      WAVE_GUARDRAIL_OUTPUT_REDACT: ${WAVE_GUARDRAIL_OUTPUT_REDACT:-}
      WAVE_EGRESS_ALLOW_PRIVATE: ${WAVE_EGRESS_ALLOW_PRIVATE:-false}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    # Only the trusted Wave service receives this socket, never agent sandboxes.
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '${WAVE_HTTP_PORT:-8080}:8080'
volumes:
  postgres_data:
  seaweed_data:
