info:
  contact: {}
  description: |-
    Managed Agents 服务。所有 /v1 接口使用 Bearer Wave API Key 认证； || Managed Agents service. All /v1 endpoints require a Bearer Wave API Key;
    由 `wave bootstrap` 签发。Authorization 填写完整的 `Bearer <Wave API Key>`。 || issue it with `wave bootstrap`. Set Authorization to the full `Bearer <Wave API Key>` value.
    offset 分页返回 data 和可选 next_offset（省略表示末页）；消息历史使用 next_after，事件列表使用最后一条 sequence 续读。 || Offset pagination returns data and an optional next_offset (omitted on the last page); message history uses next_after, and event lists resume from the last sequence.
    JSON 错误返回 {"type":"error","error":{"type":"api_error","message":"..."},"request_id":"req_..."}。文件传输的 Range 错误返回 text/plain；条件下载和健康检查可返回空响应。 || JSON errors return {"type":"error","error":{"type":"api_error","message":"..."},"request_id":"req_..."}. File-transfer Range errors return text/plain; conditional downloads and health checks may return empty responses.
    JSON 请求拒绝未知字段，非 multipart 请求体上限为 2 MiB。可空字段通过 x-nullable 标记；省略与 null 不等价。 || JSON requests reject unknown fields; non-multipart request bodies are limited to 2 MiB. Nullable fields use x-nullable; omission is not equivalent to null.
    交互式文档见 /swagger/index.html，OpenAPI spec 见 /swagger/doc.json。 || Interactive documentation: /swagger/index.html. OpenAPI spec: /swagger/doc.json.
  title: Wave AI API
  version: "1.0"
paths:
  /health:
    get:
      description: 无需认证；检查数据库连通性，超时时间 1 秒。所有响应均无响应体。 || No authentication required.
        Check database connectivity with a one-second timeout. All responses have
        empty bodies.
      operationId: health
      responses:
        "204":
          description: 数据库可用 || Database available
        "503":
          description: 数据库不可用 || Database unavailable
      summary: 健康检查 || Health check
      tags:
      - system
  /v1/agents:
    get:
      description: 分页返回当前所有者可见的 Agent，按 id 排序。 || Return Agents visible to the current
        owner, paginated and ordered by id.
      operationId: agentsList
      parameters:
      - default: 100
        description: 每页条数 || Items per page
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: 偏移量 || Offset
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agents.ListResponse'
        "400":
          description: 分页参数不合法 || Invalid pagination parameters
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "401":
          description: 缺少或无效的 Bearer Key || Missing or invalid Bearer Key
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "403":
          description: Key 不具备 API scope || Key does not have API scope
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "500":
          description: 内部错误，可用 request_id 排查 || Internal error; use request_id for
            troubleshooting
          schema:
            $ref: '#/definitions/apierr.Envelope'
      security:
      - BearerAuth: []
      summary: 列出 Agent || List Agents
      tags:
      - agents
    post:
      consumes:
      - application/json
      description: 创建一个带初始配置（版本 1）的 Agent。配置不可变字段之外的内容通过 PUT /v1/agents/:id 更新并产生新版本。
        || Create an Agent with an initial configuration (version 1). Update mutable
        configuration fields through PUT /v1/agents/:id to create a new version.
      operationId: agentsCreate
      parameters:
      - description: Agent 配置 || Agent configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/agents.Config'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/agents.Agent'
        "400":
          description: 请求体不是合法 JSON 或缺少必填字段 || Invalid JSON body or missing required
            fields
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "401":
          description: 缺少或无效的 Bearer Key || Missing or invalid Bearer Key
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "403":
          description: Key 不具备 API scope || Key does not have API scope
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "500":
          description: 内部错误，可用 request_id 排查 || Internal error; use request_id for
            troubleshooting
