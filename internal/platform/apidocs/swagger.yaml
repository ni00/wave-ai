          to 0
        format: int64
        in: query
        minimum: 0
        name: after
        type: integer
      - description: 断线续读：最后收到的事件序号；after 非空时优先使用 after || Resume after the last received
          event sequence; a nonempty after takes precedence
        in: header
        name: Last-Event-ID
        type: string
      produces:
      - text/event-stream
      - application/json
      responses:
        "200":
          description: SSE 事件流 || SSE event stream
          schema:
            type: string
        "400":
          description: 游标不合法或超过事件历史 || Cursor is invalid or beyond event history
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "401":
          description: 缺少或无效的 Bearer Key || Missing or invalid Bearer Key
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "403":
          description: Key 不具备 API scope || Key does not have API scope
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "404":
          description: 会话不存在或不在当前所有者范围内 || Session not found or outside the current
            owner's scope
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "500":
          description: 内部错误，可用 request_id 排查 || Internal error; use request_id for
            troubleshooting
          schema:
            $ref: '#/definitions/apierr.Envelope'
