          description: 内部错误，可用 request_id 排查 || Internal error; use request_id for
            troubleshooting
          schema:
            $ref: '#/definitions/apierr.Envelope'
      security:
      - BearerAuth: []
      summary: 提交工具审批或结果 || Submit tool approval or result
      tags:
      - execution
  /v1/tasks/{id}/trace:
    get:
      description: '返回当前任务的模型、工具、准备和收尾 span，以及子任务链接。trace_id 等于 root_id。摘要只统计当前任务，不重复累加子任务；初始排队不包含后续等待，未归因耗时按区间并集计算。仅含元数据，不含提示词、命令、结果和错误文本。最多
        5000 次模型调用、5000 次工具调用、10000 条阶段事件和 5000 个子任务；超出标记 truncated，缺失结束时间标记 incomplete，未知耗时为
        null。 || Return model, tool, preparation and finalization spans with child-task
        links. trace_id equals root_id. Summaries cover only this task; initial queue
        excludes later waits, and unattributed time uses the union of intervals. Metadata
        only: no prompts, commands, outputs or error text. Bounded to 5000 generations,
        5000 tools, 10000 phase events and 5000 children; truncated and incomplete
        explicitly flag limits or missing ends. Unknown durations are null.'
      operationId: executionTrace
      parameters:
      - description: 任务 ID || Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/execution.Trace'
        "401":
          description: 缺少或无效的 Bearer Key || Missing or invalid Bearer Key
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "403":
          description: Key 不具备 API scope || Key does not have API scope
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "404":
          description: 任务不存在或不在当前所有者范围内 || Task not found or outside the current owner's
            scope
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "500":
          description: 内部错误 || Internal error
          schema:
            $ref: '#/definitions/apierr.Envelope'
      security:
      - BearerAuth: []
      summary: 任务执行链路与耗时 || Task trace and timing breakdown
      tags:
      - execution
securityDefinitions:
  BearerAuth:
    description: 填写完整的 Bearer <Wave API Key>，包含 Bearer 前缀和空格。 || Enter the full Bearer
      <Wave API Key> value, including the Bearer prefix and a space.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
