definitions:
  agents.Agent:
    properties:
      archived:
        type: boolean
      config:
        $ref: '#/definitions/agents.Config'
      created_at:
        format: date-time
        type: string
      id:
        type: string
      updated_at:
        format: date-time
        type: string
      version:
        type: integer
    required:
    - archived
    - config
    - created_at
    - id
    - updated_at
    - version
    type: object
  agents.Config:
    properties:
      effort:
        type: string
      expert_ids:
        items:
          type: string
        type: array
        x-nullable: true
      instructions:
        example: Answer clearly and cite your sources.
        type: string
      model:
        example: your-model-id
        type: string
      name:
        example: Research assistant
        type: string
      skill_ids:
        items:
          type: string
        type: array
        x-nullable: true
      tools:
        items:
          $ref: '#/definitions/agents.Tool'
        type: array
        x-nullable: true
    required:
    - model
    - name
    type: object
  agents.ListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/agents.Agent'
        type: array
      next_offset:
        description: 仅有下一页时返回；省略表示末页。 || Returned only when another page exists; omitted
          on the last page.
        type: integer
    required:
    - data
    type: object
  agents.Tool:
    properties:
      approval:
        type: boolean
      credential_id:
        type: string
      description:
        type: string
      kind:
        description: builtin, mcp, custom
        enum:
        - builtin
        - mcp
        - custom
        example: custom
        type: string
      name:
        example: lookup
        type: string
      parameters:
        additionalProperties: {}
        description: 工具参数的 JSON Schema；kind=custom 时必须提供非 null 对象。 || JSON Schema
          for tool parameters; kind=custom requires a non-null object.
        type: object
        x-nullable: true
      remote_name:
        type: string
      server_url:
        description: kind=mcp 时必须提供 HTTPS URL，禁止内嵌用户名和密码。 || When kind=mcp, an HTTPS
          URL is required; embedded usernames and passwords are forbidden.
        type: string
    required:
    - kind
    - name
    type: object
  agents.UpdateRequest:
    properties:
      config:
        $ref: '#/definitions/agents.Config'
      version:
        example: 1
        minimum: 1
        type: integer
    required:
    - config
    - version
    type: object
  agents.Version:
    properties:
      agent_id:
        type: string
      config:
        $ref: '#/definitions/agents.Config'
      created_at:
        format: date-time
        type: string
      version:
        type: integer
    required:
    - agent_id
    - config
    - created_at
    - version
    type: object
  agents.VersionsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/agents.Version'
        type: array
      next_offset:
        description: 仅有下一页时返回；省略表示末页。 || Returned only when another page exists; omitted
          on the last page.
        type: integer
    required:
    - data
    type: object
  apierr.Envelope:
    properties:
      error:
        $ref: '#/definitions/apierr.EnvelopeEr'
      request_id:
        example: req_example
        type: string
      type:
        enum:
        - error
        example: error
        type: string
    required:
    - error
    - request_id
    - type
    type: object
  apierr.EnvelopeEr:
    properties:
      details:
        additionalProperties: {}
        type: object
      message:
        example: input is required
        type: string
      type:
        enum:
        - invalid_request_error
        - authentication_error
        - permission_error
        - not_found_error
        - request_too_large
        - rate_limit_error
        - api_error
        - timeout_error
        - overloaded_error
        example: invalid_request_error
        type: string
    required:
    - message
    - type
    type: object
  console.List:
    properties:
      data:
        items:
          $ref: '#/definitions/console.Record'
        type: array
      next_cursor:
        type: string
    required:
    - data
    type: object
  console.Record:
    properties:
      created_at:
        format: date-time
        type: string
      id:
        type: string
      meta:
        additionalProperties: {}
        type: object
      name:
        type: string
      root_id:
        type: string
      session_id:
        type: string
      state:
        type: string
      task_id:
        type: string
    required:
    - created_at
    - id
    - meta
    - name
    - state
    type: object
  deployments.CreateRequest:
    properties:
      agent_id:
        type: string
      cron:
        type: string
      environment_id:
        type: string
      input:
        type: string
      name:
        type: string
    required:
    - agent_id
    - input
    - name
    type: object
  deployments.Deployment:
    properties:
      agent_id:
        type: string
      created_at:
        format: date-time
        type: string
      cron:
        type: string
      environment_id:
        type: string
      id:
        type: string
      input:
        type: string
      last_task_id:
        type: string
      name:
        type: string
      next_at:
        format: date-time
        type: string
      paused:
        type: boolean
    required:
    - agent_id
    - created_at
    - id
    - input
    - name
    - paused
    type: object
  deployments.ListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/deployments.Deployment'
        type: array
      next_offset:
        description: 仅有下一页时返回；省略表示末页。 || Returned only when another page exists; omitted
          on the last page.
        type: integer
    required:
    - data
    type: object
  deployments.PauseRequest:
    properties:
      paused:
        type: boolean
        x-nullable: true
    required:
    - paused
    type: object
  deployments.Run:
    properties:
      created_at:
        format: date-time
        type: string
      deployment_id:
        type: string
      id:
        type: string
      reason:
        type: string
      session_id:
        type: string
      task_id:
        type: string
    required:
    - created_at
    - deployment_id
    - id
    type: object
  deployments.RunsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/deployments.Run'
        type: array
      next_offset:
        description: 仅有下一页时返回；省略表示末页。 || Returned only when another page exists; omitted
          on the last page.
        type: integer
    required:
    - data
    type: object
  environments.CreateRequest:
    properties:
      name:
        type: string
      packages:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
        x-nullable: true
      sandbox_backend:
        description: 省略使用服务默认。 || Omit for service defaults.
        enum:
        - sbx
        - gvisor
        - podman
        type: string
      sandbox_profile:
        description: 省略使用服务默认；仅影响新会话的沙箱。 || Omit for service defaults; applies only
          to new session sandboxes.
        enum:
        - default
        - standard
        - large
        type: string
    required:
    - name
    type: object
  environments.Environment:
    properties:
      archived:
        type: boolean
      created_at:
        format: date-time
        type: string
      id:
        type: string
      name:
        type: string
      packages:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
        x-nullable: true
      sandbox_backend:
        description: 省略使用服务默认；已有会话保留首次选择的后端。 || Omit for service defaults; existing
          sessions retain their original backend.
        enum:
        - sbx
        - gvisor
        - podman
        type: string
      sandbox_profile:
        description: 省略使用服务默认；standard 为 2 CPU/2048 MiB，large 为 2 CPU/4096 MiB。 ||
          Omit for service defaults; standard uses 2 CPUs/2048 MiB, large uses 2 CPUs/4096
          MiB.
        enum:
        - default
        - standard
        - large
        type: string
    required:
    - archived
    - created_at
    - id
    - name
    - packages
    type: object
  environments.ListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/environments.Environment'
        type: array
      next_offset:
        description: 仅有下一页时返回；省略表示末页。 || Returned only when another page exists; omitted
          on the last page.
        type: integer
    required:
    - data
    type: object
  execution.Budget:
    properties:
      max_agents:
        description: '根任务：<=0 使用 6（含协调者）；子任务固定为 0。 || Root tasks: <=0 uses 6, including
          the coordinator. Child tasks: fixed at 0.'
        type: integer
      max_concurrent_agents:
        description: '根任务：<=0 使用 3；子任务固定为 0，不能再委派。 || Root tasks: <=0 uses 3. Child
          tasks: fixed at 0, with no further delegation.'
        type: integer
      max_seconds:
        description: '根任务：<=0 使用 1800；子任务：<=0 继承父限制，正数仅可收窄。 || Root tasks: <=0 uses
          1800. Child tasks: <=0 inherits the parent limit; positive values may only
          narrow it.'
        type: integer
      max_tokens:
        description: '根任务：<=0 使用 200000；子任务：<=0 继承父限制，正数仅可收窄。 || Root tasks: <=0 uses
          200000. Child tasks: <=0 inherits the parent limit; positive values may
          only narrow it.'
        format: int64
        type: integer
      max_tool_calls:
        description: '根任务：<=0 使用 200；子任务：<=0 继承父限制，正数仅可收窄。 || Root tasks: <=0 uses
          200. Child tasks: <=0 inherits the parent limit; positive values may only
          narrow it.'
        type: integer
    type: object
  execution.CreateSessionRequest:
    properties:
      environment_id:
        type: string
      file_ids:
        items:
          type: string
        type: array
        x-nullable: true
      memory_store_ids:
        items:
          type: string
        type: array
        x-nullable: true
      title:
        type: string
    type: object
  execution.Event:
    properties:
      created_at:
        format: date-time
        type: string
      data:
        additionalProperties: {}
        type: object
      sequence:
        format: int64
        type: integer
      session_id:
        type: string
      task_id:
        type: string
      type:
        type: string
    required:
    - created_at
    - data
    - sequence
    - session_id
    - type
    type: object
  execution.EventsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/execution.Event'
        type: array
    required:
    - data
    type: object
  execution.Generation:
    properties:
      attempt:
        type: integer
      duration_ms:
        description: 耗时，单位毫秒；未知时为 null。 || Duration in milliseconds; null when unknown.
        format: int64
        type: integer
        x-nullable: true
      error:
        type: string
      finished_at:
        format: date-time
        type: string
      first_delta_ms:
        description: 首个增量的延迟，单位毫秒；尚未收到或未知时为 null。 || First-delta latency in milliseconds;
          null if no delta has arrived or the value is unknown.
        format: int64
        type: integer
        x-nullable: true
      id:
        type: string
      message_id:
        type: string
      model:
        type: string
      purpose:
        type: string
      started_at:
        format: date-time
        type: string
      state:
        enum:
        - running
        - completed
        - failed
        - interrupted
        type: string
      task_id:
        type: string
      usage:
        $ref: '#/definitions/modelclient.Usage'
    required:
    - attempt
    - duration_ms
    - first_delta_ms
    - id
    - model
    - purpose
    - started_at
    - state
    - task_id
    - usage
    type: object
  execution.GenerationsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/execution.Generation'
        type: array
      next_offset:
        description: 仅有下一页时返回；省略表示末页。 || Returned only when another page exists; omitted
          on the last page.
        type: integer
    required:
    - data
    type: object
  execution.Input:
    properties:
      consumed:
