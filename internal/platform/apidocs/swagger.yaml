      - application/json
      description: 提交期望的 version 和新配置；版本匹配才生效，产生 version+1 的新配置版本。 || Submit the expected
        version and new configuration. A matching version creates a new configuration
        at version+1.
      operationId: agentsUpdate
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: 期望版本与新配置 || Expected version and new configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/agents.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agents.Agent'
        "400":
          description: 请求体不是合法 JSON 或缺少必填字段 || Invalid JSON body or missing required
            fields
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "401":
          description: 缺少或无效的 Bearer Key || Missing or invalid Bearer Key
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "403":
          description: Key 不具备 API scope || Key does not have API scope
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "404":
          description: Agent 不存在 || Agent not found
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "409":
          description: 版本冲突 || Version conflict
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "500":
