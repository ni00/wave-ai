    get:
      description: |-
        以 SSE 持续推送会话事件。通过 after 查询参数或 Last-Event-ID 请求头从指定序号续读；游标超过事件历史时拒绝连接。连接期间每 15 秒发送 ping 注释保活。非空 after 优先于 Last-Event-ID；两者均未提供时从 0 续读。data 为完整 Event JSON，id 对应 sequence，event 对应 type。连接建立前的错误返回 JSON；开始推流后发生错误会断开连接，客户端应保存最后收到的序号再重连。 || Stream session events over SSE. Resume from the after query parameter or Last-Event-ID header; a cursor beyond event history is rejected. A ping comment is sent every 15 seconds. A nonempty after takes precedence over Last-Event-ID; when neither is provided, resume from 0. data contains the full Event JSON, id is sequence, and event is type. Errors before streaming return JSON; errors during streaming close the connection. Save the last received sequence before reconnecting.

        示例（每条消息由空行结束）： || Example (each message ends with a blank line):
        ```text
        id: 1
        event: task.created
        data: {"session_id":"session_example","sequence":1,"task_id":"task_example","type":"task.created","data":{"task_id":"task_example"},"created_at":"2026-09-13T00:00:00Z"}

        : ping
        ```
      operationId: executionStreamEvents
