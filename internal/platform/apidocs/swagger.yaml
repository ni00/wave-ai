      created_at:
        format: date-time
        type: string
      id:
        type: string
      task_id:
        type: string
      text:
        type: string
    required:
    - consumed
    - created_at
    - id
    - task_id
    - text
    type: object
  execution.InputsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/execution.Input'
        type: array
      next_offset:
        description: 仅有下一页时返回；省略表示末页。 || Returned only when another page exists; omitted
          on the last page.
        type: integer
    required:
    - data
    type: object
  execution.Message:
    properties:
      call_id:
        type: string
      created_at:
        format: date-time
        type: string
      error_code:
        type: string
      id:
        type: string
      is_error:
        type: boolean
      role:
        type: string
      root_id:
        type: string
      sequence:
        format: int64
        type: integer
      session_id:
        type: string
      source:
        type: string
      source_task_id:
        type: string
      task_id:
        type: string
      text:
        type: string
      tool_calls:
        items:
          $ref: '#/definitions/modelclient.ToolCall'
        type: array
    required:
    - created_at
    - id
    - role
    - root_id
    - sequence
    - session_id
    - source
    - task_id
    - text
    type: object
  execution.MessagesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/execution.Message'
        type: array
      next_after:
        format: int64
        type: integer
    required:
    - data
    - next_after
    type: object
  execution.ReconcileRequest:
    properties:
      confirm_stopped:
        enum:
        - true
        example: true
        type: boolean
    required:
    - confirm_stopped
    type: object
  execution.RequiredAction:
    properties:
      call_id:
        type: string
      reason:
        type: string
      task_id:
        type: string
      tool:
        $ref: '#/definitions/execution.ToolCall'
      type:
        enum:
        - approve_tool
        - submit_tool_result
        - confirm_tool_outcome
        - reconcile_task
        type: string
    required:
    - task_id
    - type
    type: object
  execution.RequiredActionsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/execution.RequiredAction'
        type: array
    required:
    - data
    type: object
  execution.Session:
    properties:
      active_task_id:
        type: string
      archived:
        type: boolean
      created_at:
        format: date-time
        type: string
      environment_id:
        type: string
      event_sequence:
        format: int64
        type: integer
      file_ids:
        items:
          type: string
        type: array
        x-nullable: true
      id:
        type: string
      memory_store_ids:
        items:
          type: string
        type: array
        x-nullable: true
      message_sequence:
        format: int64
        type: integer
      title:
        type: string
    required:
    - archived
    - created_at
    - event_sequence
    - file_ids
    - id
    - memory_store_ids
    - message_sequence
    - title
    type: object
  execution.SessionsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/execution.Session'
        type: array
      next_offset:
        description: 仅有下一页时返回；省略表示末页。 || Returned only when another page exists; omitted
          on the last page.
        type: integer
    required:
    - data
    type: object
  execution.Task:
    properties:
      agent:
        $ref: '#/definitions/agents.Config'
      agent_count:
        type: integer
      agent_id:
        type: string
      agent_version:
        type: integer
      attempts:
        type: integer
      budget:
        $ref: '#/definitions/execution.Budget'
      cancel_requested:
        type: boolean
      created_at:
        format: date-time
        type: string
      error:
        type: string
      experts:
        additionalProperties:
          $ref: '#/definitions/agents.Agent'
        type: object
      finished_at:
        format: date-time
        type: string
      id:
        type: string
      parent_id:
        type: string
      result:
        type: string
      root_id:
        type: string
      session_id:
        type: string
      started_at:
        format: date-time
        type: string
      state:
        enum:
        - queued
        - running
        - waiting
        - unknown
        - succeeded
        - partial
        - failed
        - canceled
        example: queued
        type: string
      tool_calls:
        type: integer
      updated_at:
        format: date-time
        type: string
      usage_known:
        type: boolean
      used_tokens:
        format: int64
        type: integer
    required:
    - agent
    - agent_count
    - agent_id
    - agent_version
    - attempts
    - budget
    - cancel_requested
    - created_at
    - id
    - root_id
    - session_id
    - state
    - tool_calls
    - updated_at
    - usage_known
    - used_tokens
    type: object
  execution.TaskRequest:
    properties:
      agent_id:
        example: agent_example
        minLength: 1
        type: string
      budget:
        $ref: '#/definitions/execution.Budget'
      input:
        example: Summarize the uploaded report.
        minLength: 1
        type: string
    required:
    - agent_id
    - input
    type: object
  execution.TasksResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/execution.Task'
        type: array
      next_offset:
        description: 仅有下一页时返回；省略表示末页。 || Returned only when another page exists; omitted
          on the last page.
        type: integer
    required:
    - data
    type: object
  execution.TextRequest:
    properties:
      text:
        example: Focus on the deployment risks.
        minLength: 1
        type: string
    required:
    - text
    type: object
  execution.ToolCall:
    properties:
      approval:
        type: boolean
      arguments:
        type: string
      created_at:
        format: date-time
        type: string
      delivered:
        type: boolean
      error_code:
        type: string
      finished_at:
        format: date-time
        type: string
      id:
        type: string
      is_error:
        type: boolean
      model_call_id:
        type: string
      result:
        type: string
      started_at:
        format: date-time
        type: string
      status:
        description: waiting_children 表示协调者工具正在等待子任务。 || waiting_children means the
          coordinator tool is waiting for child tasks.
        enum:
        - ready
        - approval
        - custom
        - running
        - waiting_children
        - unknown
        - completed
        type: string
      task_id:
        type: string
      tool:
        $ref: '#/definitions/agents.Tool'
      updated_at:
        format: date-time
        type: string
    required:
    - arguments
    - created_at
    - delivered
    - id
    - is_error
    - model_call_id
    - status
    - task_id
    - tool
    - updated_at
    type: object
  execution.ToolCallsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/execution.ToolCall'
        type: array
    required:
    - data
    type: object
  execution.ToolResultRequest:
    properties:
      approve:
        description: 与 result 互斥；false 表示拒绝，null 等同未提供。 || Mutually exclusive with
          result; false rejects the call, while null means not provided.
        type: boolean
        x-nullable: true
      error_code:
        description: 仅在 is_error=true 时允许非空。 || May be nonempty only when is_error=true.
        type: string
      is_error:
        type: boolean
      result:
        description: 与 approve 互斥；空字符串是有效结果，null 等同未提供。 || Mutually exclusive with
          approve; an empty string is a valid result, while null means not provided.
        type: string
        x-nullable: true
    type: object
  execution.Trace:
    properties:
      incomplete:
        type: boolean
      session_id:
        type: string
      spans:
        items:
          $ref: '#/definitions/observe.Span'
        type: array
      state:
        type: string
      summary:
        $ref: '#/definitions/execution.TraceSummary'
      task_id:
        type: string
      trace_id:
        type: string
      truncated:
        type: boolean
      version:
        type: integer
    required:
    - incomplete
    - session_id
    - spans
    - state
    - summary
    - task_id
    - trace_id
    - truncated
    - version
    type: object
  execution.TraceSummary:
    properties:
      cached_input_tokens:
        format: int64
        type: integer
      failed_model_calls:
        type: integer
      failed_tool_calls:
        type: integer
      initial_queue_ms:
        type: number
        x-nullable: true
      input_tokens:
        format: int64
        type: integer
      model_calls:
        type: integer
      model_ms:
        type: number
      output_tokens:
        format: int64
        type: integer
      phase_ms:
        additionalProperties:
          format: float64
          type: number
        type: object
      tool_calls:
        type: integer
      tool_ms:
        type: number
      unattributed_ms:
        type: number
        x-nullable: true
      usage_known:
        type: boolean
      wall_ms:
        type: number
        x-nullable: true
    required:
    - cached_input_tokens
    - failed_model_calls
    - failed_tool_calls
    - initial_queue_ms
    - input_tokens
    - model_calls
    - model_ms
    - output_tokens
    - phase_ms
    - tool_calls
    - tool_ms
    - unattributed_ms
    - usage_known
    - wall_ms
    type: object
  files.File:
    properties:
      created_at:
        format: date-time
        type: string
      deleted:
        type: boolean
      id:
        type: string
      mime_type:
        type: string
      name:
        type: string
      path:
        type: string
      session_id:
        type: string
      size:
        format: int64
        type: integer
      task_id:
        type: string
    required:
    - created_at
    - deleted
    - id
    - mime_type
    - name
    - size
    type: object
  files.ListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/files.File'
        type: array
      next_offset:
        description: 仅有下一页时返回；省略表示末页。 || Returned only when another page exists; omitted
          on the last page.
        type: integer
    required:
    - data
    type: object
  memory.Conflict:
    properties:
      actual_version:
        type: integer
      content:
        type: string
      created_at:
        format: date-time
        type: string
      expected_version:
        type: integer
      id:
        type: string
      path:
