  /v1/files/{id}/content:
    get:
      description: '按 ID 读取文件内容，经身份和归属校验后由服务端流式返回；文件按附件（Content-Disposition: attachment）发送，支持
        Range 请求，禁止浏览器缓存。 || Download file content by ID after authentication and
        ownership checks. The server streams it with Content-Disposition: attachment
        and Range support; browser caching is disabled.'
      operationId: filesContent
      parameters:
      - description: 文件 ID || File ID
        in: path
        name: id
        required: true
        type: string
      - description: 字节范围，如 bytes=0-1023 || Byte range, for example bytes=0-1023
        in: header
        name: Range
        type: string
      - description: 仅当 Last-Modified 日期匹配时返回范围，否则返回完整文件 || Return the range only
          if the Last-Modified date matches; otherwise return the full file
        in: header
        name: If-Range
        type: string
      - description: 未修改时返回 304（HTTP 日期） || Return 304 if unmodified (HTTP date)
        in: header
        name: If-Modified-Since
        type: string
      - description: 此日期后有修改时返回 412（HTTP 日期） || Return 412 if modified after this
          date (HTTP date)
        in: header
        name: If-Unmodified-Since
        type: string
      produces:
      - application/octet-stream
      - multipart/byteranges
      - application/json
      - text/plain
      responses:
        "200":
          description: 文件二进制内容 || File bytes
          headers:
            Accept-Ranges:
              description: bytes
              type: string
            Content-Disposition:
              description: attachment; filename=...
              type: string
            Last-Modified:
              description: HTTP 日期 || HTTP date
              type: string
          schema:
            type: file
        "206":
          description: 部分内容；多个范围返回 multipart/byteranges || Partial content; multiple
            ranges return multipart/byteranges
          headers:
            Accept-Ranges:
              description: bytes
              type: string
            Content-Disposition:
              description: attachment; filename=...
              type: string
            Content-Range:
              description: '单范围响应：bytes start-end/total || Single-range response:
                bytes start-end/total'
              type: string
            Last-Modified:
              description: HTTP 日期 || HTTP date
              type: string
          schema:
            type: file
        "304":
          description: 未修改，无响应体 || Not modified; empty body
        "401":
          description: 缺少或无效的 Bearer Key || Missing or invalid Bearer Key
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "403":
          description: Key 不具备 API scope || Key does not have API scope
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "404":
          description: 文件不存在、已删除或不在当前所有者范围内 || File not found, deleted or outside
            the current owner's scope
          schema:
            $ref: '#/definitions/apierr.Envelope'
        "412":
          description: 条件请求失败，无响应体 || Precondition failed; empty body
        "416":
          description: Range 无效或越界；底层下载错误为 text/plain || Invalid or unsatisfiable
            Range; underlying download errors use text/plain
          headers:
            Content-Range:
              description: '范围越界时：bytes */total || For an unsatisfiable range: bytes
                */total'
              type: string
          schema:
            type: string
        "500":
          description: 内部错误，可用 request_id 排查 || Internal error; use request_id for
            troubleshooting
          schema:
            $ref: '#/definitions/apierr.Envelope'
      security:
      - BearerAuth: []
      summary: 下载文件内容 || Download file content
      tags:
      - files
